version: "3.9"

services:
  consul:
    image: hashicorp/consul:1.16.2
    container_name: consul-dev
    ports:
      - "8500:8500"     # Consul UI/API
      - "8600:8600/udp" # DNS (optional)
    command: agent -dev -ui -client=0.0.0.0
    networks:
      - consul-net

networks:
  consul-net:
    driver: bridge
